org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# Keep the app (and its notes) installed after on-device tests; uninstalling would wipe the data.
android.injected.androidTest.leaveApksInstalledAfterRun=true
# The iOS targets can only be built on a Mac; on Linux they are skipped without a warning.
kotlin.native.ignoreDisabledTargets=true
# Linux can compile (not link) the iOS code: ./gradlew :shared:compileKotlinIosSimulatorArm64
# :composeApp:compileKotlinIosSimulatorArm64 catches iOS-only errors without the Mac CI.
kotlin.native.enableKlibsCrossCompilation=true
