name: iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Shared tests on the iOS simulator
        run: ./gradlew --no-daemon :shared:iosSimulatorArm64Test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd iosApp && xcodegen generate

      - name: Build for simulator
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath iosApp/build \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run on simulator and screenshot
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data["devices"].items():
              for d in devices:
                  if d.get("name", "").startswith("iPad"):
                      print(d["udid"])
                      sys.exit(0)
          sys.exit(1)
          ')
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" iosApp/build/Build/Products/Debug-iphonesimulator/4ENote.app
          xcrun simctl launch --stdout="$PWD/selftest.txt" "$UDID" com.gerko.fourenote -selftest
          sleep 20
          xcrun simctl io "$UDID" screenshot ipad.png
          # Shared crypto/gzip known answers (CryptoSelfTest), run by the app itself.
          cat selftest.txt
          grep -q "SELFTEST OK" selftest.txt

      - name: Upload iPad screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipad-screenshot
          path: ipad.png
