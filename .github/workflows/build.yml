name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  assemble:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.2 build-tools;37.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest :shared:jvmTest --console=plain

      - name: Run desktop UI tests
        run: ./gradlew :composeApp:desktopTest --console=plain

      - name: Upload desktop screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-screenshot
          path: composeApp/build/screenshots/app.png
