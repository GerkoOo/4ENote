name: Release

# Builds, signs and publishes a release from the public code when a version tag (v0.4.0) is
# pushed, and attests that this exact APK was built here from that commit (check it with
# `gh attestation verify 4ENote.apk --repo GerkoOo/4ENote`).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write      # create the GitHub release
  id-token: write      # sign the build attestation
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.2 build-tools;37.0.0"

      - name: The tag matches the app's version
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME but versionName $version"; exit 1; }

      - name: Signing keys from the repository's secrets
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          ROTATION_LINEAGE_B64: ${{ secrets.ROTATION_LINEAGE_B64 }}
          OLD_DEBUG_KEYSTORE_B64: ${{ secrets.OLD_DEBUG_KEYSTORE_B64 }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          conf="$HOME/.config/4enote"
          mkdir -p "$conf" "$HOME/.android"
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$conf/release.jks"
          echo "$ROTATION_LINEAGE_B64" | base64 -d > "$conf/lineage.bin"
          echo "$OLD_DEBUG_KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=4enote\nkeyPassword=%s\n' \
            "$conf/release.jks" "$RELEASE_KEY_PASSWORD" "$RELEASE_KEY_PASSWORD" > "$conf/signing.properties"
          printf 'release.signing=%s\ngoogle.clientId=%s\n' "$conf/signing.properties" "$GOOGLE_CLIENT_ID" > local.properties
          chmod 600 "$conf"/* "$HOME/.android/debug.keystore"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest :shared:jvmTest --console=plain

      - name: Build and sign
        run: |
          ./gradlew assembleRelease --console=plain
          tools/release/sign-release.sh app/build/outputs/apk/release/app-release.apk 4ENote.apk

      - name: Signed with 4ENote's published key
        run: |
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs 4ENote.apk \
            | grep -q 'certificate SHA-256 digest: d169ad599d6094b7f11eeffd913f4c953db51bc61755c4a3fae3e2ddd2eb271a'

      - name: Attest that this APK was built here from this commit
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 4ENote.apk

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The release notes: this version's section of the CHANGELOG.
          awk -v v="$version" '$0 ~ "^## "v" " || $0 == "## "v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          {
            echo
            echo "APK SHA-256: \`$(sha256sum 4ENote.apk | cut -d' ' -f1)\`"
            echo "Built by GitHub Actions from $GITHUB_SHA; check with \`gh attestation verify 4ENote.apk --repo $GITHUB_REPOSITORY\`."
          } >> notes.md
          gh release create "$GITHUB_REF_NAME" 4ENote.apk --title "4ENote $version" --notes-file notes.md

      - name: Remove the keys
        if: always()
        run: rm -rf "$HOME/.config/4enote" "$HOME/.android/debug.keystore" local.properties
